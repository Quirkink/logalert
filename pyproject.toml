[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "logalert"
version = "0.1.0"
description = "Capture Python errors and deliver them to Telegram or Matrix, with an optional Redis-backed durable queue"
authors = [
    {name = "Aiko Sora", email = "altairteam@bk.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "logging",
    "alerts",
    "error-tracking",
    "observability",
    "traceback",
    "telegram",
    "matrix",
    "redis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
telegram = ["httpx>=0.27"]
matrix = ["httpx>=0.27"]
redis = ["redis>=5.2"]
matrix-e2ee = ["matrix-nio[e2e]>=0.25"]
all = [
    "httpx>=0.27",
    "redis>=5.2",
    "matrix-nio[e2e]>=0.25",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "fakeredis>=2.26",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "build",
    "twine",
]

[project.scripts]
logalert = "logalert.cli:main"

[project.urls]
Homepage = "https://github.com/Quirkink/logalert"
Repository = "https://github.com/Quirkink/logalert"
Issues = "https://github.com/Quirkink/logalert/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/logalert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: talks to real external services (Telegram, Matrix, Redis). Disabled by default",
]
addopts = "-m 'not live' --disable-socket --allow-hosts=localhost,127.0.0.1,::1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF022",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
